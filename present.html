<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>present</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Comfortaa', cursive, sans-serif;
        }

        body {
            background-color: #f9e8ee; 
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;           
        }
        .card-container {
            background-color: #ffffff;
            border-radius: 30px;
            padding: 35px 25px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(233, 150, 175, 0.25);
            border: 3px solid #f2cddb;
            }

            /* 1. Заголовок зверху */
        .main-title {
            color: #7b2cbf;
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 8px;
            line-height: 1.3;
            }

        .subtitle {
            color: #ad1457;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 20px;
            }

            /* 2. Аватар */
        .avatar-wrapper {
            margin-bottom: 25px;
            }

        .avatar-wrapper img {
            width: 120px;
            height: auto;
            border-radius: 50%;
            }

            /* 3. Блок з трьома кнопками-подарунками */
        .gifts-container {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            }

        .gift-btn {
            flex: 1;
            background-color: #fff0f5;
            border: 2px solid #f48fb1;
            border-radius: 20px;
            padding: 15px 8px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
            }

        .gift-btn:hover {
            transform: translateY(-5px) scale(1.03);
            box-shadow: 0 10px 20px rgba(244, 143, 177, 0.35);
            background-color: #ffe4ec;
            border-color: #ec407a;
            }

            .gift-btn:active {
            transform: translateY(-1px);
            }

            /* Картинка подарунка всередині кнопки */
        .gift-btn img {
            width: 60px;
            height: 60px;
            object-fit: contain;
            }

        .gift-label {
            color: #8e24aa;
            font-size: 13px;
            font-weight: 700;
            }

        .gifts-container {
            display: flex;
            justify-content: center;
            gap: 14px;
            margin-top: 10px;
            }

            /* Кнопка-обгортка */
        .gift-btn {
            flex: 1;
            max-width: 110px; /* Контроль максимальної ширини */
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

            .gift-btn:hover {
            transform: translateY(-6px) scale(1.04);
        }

        .gift-btn:active {
            transform: scale(0.95);
        }

            /* Картинка pres2.jpg всередині кнопки */
        .gift-btn img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 22px; /* Ідеально підходить під радіус картинки */
            box-shadow: 0 8px 18px rgba(233, 150, 175, 0.4);
            border: 2px solid #f2cddb;
            transition: box-shadow 0.25s ease, border-color 0.25s ease;
        }

        .gift-btn:hover img {
            box-shadow: 0 12px 24px rgba(236, 64, 122, 0.35);
            border-color: #ec407a;
        }

        .gift-label {
            color: #8e24aa;
            font-size: 14px;
            font-weight: 700;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
            justify-content: center;
            align-items: center;
            padding: 20px;
            }

        .modal-content {
            background: #fff;
            padding: 25px;
            border-radius: 25px;
            text-align: center;
            max-width: 300px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            }

        .close-btn {
            margin-top: 15px;
            padding: 8px 20px;
            border: none;
            background: #ec407a;
            color: white;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            }
    </style>
</head>
<body>
    <div class="card-container">

        <h1 class="main-title">Забирай свої подарунки!🎁✨</h1>
        <div class="avatar-wrapper">
            <img id="avatar" src="gif/avatar_happy.gif" alt="Cute Character" onerror="this.src='gif/avatar.gif'">
        </div>
        <p class="subtitle">Натискай на будь-яку коробку 💖</p>

        <div class="gifts-container">

            <button class="gift-btn" onclick="openGift('Подарунок №1: Романтичне побачення 🍕')">
                <img src="img/pres3.png" alt="Подарунок 1" onerror="this.outerHTML='🎁'">
                <span class="gift-label"></span>
            </button>

            <button class="gift-btn" onclick="openGift('Подарунок №2: Твоя улюблена сладость 🍫')">
                <img src="img/pres3.png" alt="Подарунок 2">
                <span class="gift-label"></span>
            </button>

            <button class="gift-btn" onclick="openGift('Подарунок №3: Виконання одного бажання ✨')">
                <img src="img/pres3.png" alt="Подарунок 3">
                <span class="gift-label"></span>
            </button>
        </div>
    </div>
</body>
</html>
